<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Framework Assistant - Lexique Intelligent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {
            --primary: #3C3489;
            --primary-light: #EEEDFE;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 { color: var(--primary); margin-bottom: 10px; }
        .header p { color: var(--text-muted); }

        /* Barre de recherche */
        .search-container {
            max-width: 800px;
            margin: 0 auto 30px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 18px 20px 18px 50px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            outline: none;
            transition: all 0.2s;
        }

        #searchInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: var(--text-muted);
        }

        /* Tags d'aide à la recherche */
        .search-hints {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .hint-tag {
            background: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
            border: 1px solid var(--primary);
            cursor: pointer;
            transition: 0.2s;
        }

        .hint-tag:hover { background: var(--primary-light); }

        /* Grille de résultats */
        .results-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .library-badge {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 10px;
        }

        .cmd-name {
            font-family: 'Consolas', monospace;
            font-size: 15px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .cmd-desc {
            font-size: 14px;
            color: var(--text-main);
            flex-grow: 1;
        }

        .cmd-example {
            margin-top: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
            position: relative;
        }

        .cmd-example:hover::after {
            content: "Copier 📋";
            position: absolute;
            right: 10px;
            color: var(--primary);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }

        /* Couleurs des bibliothèques */
        .bg-builtin { background: #dcfce7; color: #166534; }
        .bg-string { background: #fef3c7; color: #92400e; }
        .bg-collections { background: #dbeafe; color: #1e40af; }
        .bg-os { background: #ede9fe; color: #5b21b6; }
        .bg-http { background: #fee2e2; color: #991b1b; }
        .bg-cli { background: #f1f5f9; color: #334155; }
    </style>
</head>
<body>

<div class="header">
    <h1>Robot Framework Helper</h1>
    <p>Trouvez le mot-clé dont vous avez besoin pour vos tests automatisés</p>
</div>

<div class="search-container">
    <i class="ti ti-search search-icon"></i>
    <input type="text" id="searchInput" placeholder="Que voulez-vous faire ? (ex: vérifier, attendre, dossier, fichier, api...)">
    
    <div class="search-hints">
        <span class="hint-tag" onclick="quickSearch('vérifier')">Vérifier</span>
        <span class="hint-tag" onclick="quickSearch('attendre')">Attendre</span>
        <span class="hint-tag" onclick="quickSearch('créer')">Créer</span>
        <span class="hint-tag" onclick="quickSearch('supprimer')">Supprimer</span>
        <span class="hint-tag" onclick="quickSearch('variable')">Variables</span>
        <span class="hint-tag" onclick="quickSearch('api')">API/HTTP</span>
    </div>
</div>

<div class="results-grid" id="resultsGrid">
    </div>

<script>
    // Chargement des données (basé sur ton fichier)
    const COMMANDS = [
        // CLI
        { name: "robot <fichier>", lib: "CLI", cat: "cli", desc: "Lancer l'exécution de vos tests.", example: "robot tests/mon_test.robot", tags: "exécuter lancer run" },
        { name: "robot --variable VAR:VAL", lib: "CLI", cat: "cli", desc: "Passer une variable au test depuis le terminal.", example: "robot --variable ENV:prod tests/", tags: "variable environnement" },
        
        // BuiltIn (Extraits)
        { name: "Should Be Equal", lib: "BuiltIn", cat: "builtin", desc: "Vérifier que deux éléments sont identiques.", example: "Should Be Equal    ${resultat}    succès", tags: "vérifier égalité assertion check" },
        { name: "Log To Console", lib: "BuiltIn", cat: "builtin", desc: "Afficher un message dans le terminal pendant le test.", example: "Log To Console    Étape 1 terminée", tags: "afficher print voir" },
        { name: "Wait Until Keyword Succeeds", lib: "BuiltIn", cat: "builtin", desc: "Attendre qu'une action réussisse (réessaie plusieurs fois).", example: "Wait Until Keyword Succeeds    10s    2s    Action", tags: "attendre retry boucle pause" },
        { name: "Run Keyword If", lib: "BuiltIn", cat: "builtin", desc: "Exécuter une action seulement si une condition est vraie.", example: "Run Keyword If    ${age} > 18    Valider", tags: "si condition logic" },
        { name: "Set Variable", lib: "BuiltIn", cat: "builtin", desc: "Créer ou modifier une variable.", example: "${nom}=    Set Variable    Robot", tags: "créer assigner stocker" },
        
        // OS
        { name: "File Should Exist", lib: "OperatingSystem", cat: "os", desc: "Vérifier si un fichier est présent sur l'ordinateur.", example: "File Should Exist    C:/rapport.pdf", tags: "fichier document vérifier trouver" },
        { name: "Create Directory", lib: "OperatingSystem", cat: "os", desc: "Créer un nouveau dossier.", example: "Create Directory    ./resultats", tags: "dossier créer répertoire folder" },
        
        // Collections
        { name: "Append To List", lib: "Collections", cat: "collections", desc: "Ajouter un élément à la fin d'une liste.", example: "Append To List    ${ma_liste}    nouvel_objet", tags: "liste ajouter remplir" },
        
        // HTTP
        { name: "GET On Session", lib: "RequestsLibrary", cat: "http", desc: "Envoyer une requête API (GET) pour récupérer des données.", example: "GET On Session    ma_session    /users", tags: "api http récupérer web service" },
        { name: "POST On Session", lib: "RequestsLibrary", cat: "http", desc: "Envoyer des données vers une API (création).", example: "POST On Session    ma_session    /login    json=${corps}", tags: "api http envoyer créer" }
        
        // Tu peux rajouter le reste des commandes du HTML ici en suivant ce format...
    ];

    const resultsGrid = document.getElementById('resultsGrid');
    const searchInput = document.getElementById('searchInput');

    function displayCommands(list) {
        resultsGrid.innerHTML = '';
        
        if (list.length === 0) {
            resultsGrid.innerHTML = '<div class="no-results">Aucune commande ne correspond à votre recherche.</div>';
            return;
        }

        list.forEach(cmd => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="library-badge bg-${cmd.cat}">${cmd.lib}</span>
                <div class="cmd-name">${cmd.name}</div>
                <div class="cmd-desc">${cmd.desc}</div>
                <div class="cmd-example" onclick="copyToClipboard('${cmd.example}')" title="Cliquez pour copier">
                    ${cmd.example}
                </div>
            `;
            resultsGrid.appendChild(card);
        });
    }

    function filterCommands() {
        const query = searchInput.value.toLowerCase();
        const filtered = COMMANDS.filter(cmd => {
            return cmd.name.toLowerCase().includes(query) || 
                   cmd.desc.toLowerCase().includes(query) || 
                   cmd.tags.toLowerCase().includes(query) ||
                   cmd.lib.toLowerCase().includes(query);
        });
        displayCommands(filtered);
    }

    function quickSearch(text) {
        searchInput.value = text;
        filterCommands();
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('Copié dans le presse-papier !');
        });
    }

    searchInput.addEventListener('input', filterCommands);

    // Initialisation
    displayCommands(COMMANDS);
</script>

</body>
</html>
