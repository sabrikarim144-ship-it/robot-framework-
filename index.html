
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.container { padding: 1rem 0; }
.search-bar { position: relative; margin-bottom: 1.5rem; }
.search-bar input { width: 100%; padding: 10px 16px 10px 40px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
.search-bar input:focus { border-color: var(--color-border-primary); }
.search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); font-size: 18px; pointer-events: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-btn { padding: 5px 14px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: 20px; background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.filter-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
.filter-btn.active { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.stat-label { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
.section { margin-bottom: 1.5rem; }
.section-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--border-radius-md); cursor: pointer; user-select: none; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); margin-bottom: 4px; }
.section-header:hover { background: var(--color-background-secondary); border-color: var(--color-border-secondary); }
.section-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); flex: 1; }
.section-count { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 2px 10px; }
.chevron { font-size: 16px; color: var(--color-text-secondary); transition: transform 0.2s; }
.chevron.open { transform: rotate(180deg); }
.commands-grid { display: grid; gap: 6px; display: none; }
.commands-grid.open { display: grid; }
.cmd-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 12px 14px; display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: start; }
.cmd-card:hover { border-color: var(--color-border-secondary); }
.cmd-name { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: #3C3489; background: #EEEDFE; border-radius: 4px; padding: 4px 8px; word-break: break-all; line-height: 1.5; }
.cmd-right { }
.cmd-desc { font-size: 13px; color: var(--color-text-primary); line-height: 1.6; margin-bottom: 4px; }
.cmd-example { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-secondary); background: var(--color-background-secondary); border-radius: 4px; padding: 3px 7px; display: inline-block; margin-top: 4px; }
.color-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.no-results { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }
</style>

<div class="container">
  <h2 class="sr-only">Récapitulatif des commandes Robot Framework avec Python</h2>

  <div class="search-bar">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="searchInput" placeholder="Rechercher une commande..." oninput="filterAll()">
  </div>

  <div class="stats" id="statsBar">
    <div class="stat-card"><div class="stat-num" id="totalCount">0</div><div class="stat-label">commandes</div></div>
    <div class="stat-card"><div class="stat-num" id="catCount">0</div><div class="stat-label">catégories</div></div>
    <div class="stat-card"><div class="stat-num" id="visCount">0</div><div class="stat-label">affichées</div></div>
    <div class="stat-card"><div class="stat-num" id="searchCount">-</div><div class="stat-label">résultats</div></div>
  </div>

  <div class="filters" id="filterBar"></div>
  <div id="content"></div>
</div>

let activeCategory = "all";

function filterAll() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  let totalVis = 0;
  let searchHits = 0;

  CATEGORIES.forEach(cat => {
    const section = document.getElementById("sec_" + cat.id);
    const grid = document.getElementById("grid_" + cat.id);
    let catVis = 0;

    cat.commands.forEach(cmd => {
      const card = document.getElementById("card_" + cat.id + "_" + cmd.name.replace(/\s+/g,"_"));
      const inCategory = activeCategory === "all" || activeCategory === cat.id;
      const matchesSearch = !q || cmd.name.toLowerCase().includes(q) || cmd.desc.toLowerCase().includes(q) || cmd.example.toLowerCase().includes(q);
      const show = inCategory && matchesSearch;
      if (card) card.style.display = show ? "" : "none";
      if (show) { catVis++; totalVis++; }
      if (matchesSearch && inCategory) searchHits++;
    });

    if (section) section.style.display = catVis === 0 ? "none" : "";
    const countEl = document.getElementById("cnt_" + cat.id);
    if (countEl) countEl.textContent = catVis;
  });

  const total = CATEGORIES.reduce((s, c) => s + c.commands.length, 0);
  document.getElementById("totalCount").textContent = total;
  document.getElementById("catCount").textContent = CATEGORIES.length;
  document.getElementById("visCount").textContent = totalVis;
  document.getElementById("searchCount").textContent = q ? searchHits : "-";

  document.getElementById("noResults").style.display = totalVis === 0 ? "" : "none";
}

function setCategory(id) {
  activeCategory = id;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("fb_" + id).classList.add("active");
  filterAll();
}

function toggleSection(id) {
  const grid = document.getElementById("grid_" + id);
  const chevron = document.getElementById("chev_" + id);
  const open = grid.classList.toggle("open");
  chevron.classList.toggle("open", open);
}

function build() {
  const filterBar = document.getElementById("filterBar");
  const content = document.getElementById("content");

  const allBtn = document.createElement("button");
  allBtn.className = "filter-btn active";
  allBtn.id = "fb_all";
  allBtn.textContent = "Toutes les catégories";
  allBtn.onclick = () => setCategory("all");
  filterBar.appendChild(allBtn);

  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.id = "fb_" + cat.id;
    btn.style.cssText = `border-color: ${cat.color}33; color: ${cat.color};`;
    btn.textContent = cat.label;
    btn.onclick = () => setCategory(cat.id);
    filterBar.appendChild(btn);

    const section = document.createElement("div");
    section.className = "section";
    section.id = "sec_" + cat.id;

    const header = document.createElement("div");
    header.className = "section-header";
    header.onclick = () => toggleSection(cat.id);
    header.innerHTML = `
      <span class="color-dot" style="background:${cat.color}"></span>
      <span class="section-title">${cat.label}</span>
      <span class="section-count" id="cnt_${cat.id}">${cat.commands.length}</span>
      <i class="ti ti-chevron-down chevron" id="chev_${cat.id}" aria-hidden="true"></i>
    `;
    section.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "commands-grid open";
    grid.id = "grid_" + cat.id;

    cat.commands.forEach(cmd => {
      const card = document.createElement("div");
      card.className = "cmd-card";
      card.id = "card_" + cat.id + "_" + cmd.name.replace(/\s+/g,"_");
      card.innerHTML = `
        <div class="cmd-name">${cmd.name}</div>
        <div class="cmd-right">
          <div class="cmd-desc">${cmd.desc}</div>
          <div class="cmd-example">${cmd.example}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    content.appendChild(section);
  });

  const noRes = document.createElement("div");
  noRes.className = "no-results";
  noRes.id = "noResults";
  noRes.style.display = "none";
  noRes.innerHTML = '<i class="ti ti-search-off" aria-hidden="true" style="font-size:24px; display:block; margin-bottom:8px"></i>Aucune commande trouvée';
  content.appendChild(noRes);

  filterAll();
}

build();
</script>
